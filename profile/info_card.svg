<text x="430" y="30" fill="#c9d1d9">
<tspan x="430" y="30">OmAr-Kader ———————————————————————————————————————————————</tspan>
<tspan x="430" y="50" class="cc">. </tspan><tspan class="key">Role</tspan>:<tspan class="cc"> ............ </tspan><tspan class="value">Software Engineer — Mobile &amp; Back-End</tspan>
<tspan x="430" y="70" class="cc">. </tspan><tspan class="key">Years</tspan>:<tspan class="cc"> ............... </tspan><tspan class="value">6+ years shipping production apps</tspan>
<tspan x="430" y="90" class="cc">. </tspan><tspan class="key">IDE</tspan>:<tspan class="cc"> .................... </tspan><tspan class="value">Xcode, VS Code, Android Studio</tspan>
<tspan x="430" y="110" class="cc">. </tspan><tspan class="key">Languages</tspan>:<tspan class="cc"> ............. </tspan><tspan class="value">Swift, Kotlin, Rust, TypeScript</tspan>
<tspan x="430" y="150" class="cc">. </tspan><tspan class="key">Frameworks</tspan>:<tspan class="cc"> ........................... </tspan><tspan class="value">Compose, SwiftUI</tspan>
<tspan x="430" y="170" class="cc">. </tspan><tspan class="key">Shared</tspan>:<tspan class="cc"> ......... </tspan><tspan class="value">React Native CLI, Kotlin Multiplatform</tspan>
<tspan x="430" y="210" class="cc">. </tspan><tspan class="key">Backend</tspan>:<tspan class="cc"> ................ </tspan><tspan class="value">Axum, NestJS, Express, Fastify</tspan>
<tspan x="430" y="230" class="cc">. </tspan><tspan class="key">Databases</tspan>:<tspan class="cc"> .......... </tspan><tspan class="value">PostgreSQL, MongoDB, Harper, Realm</tspan>
<tspan x="430" y="250" class="cc">. </tspan><tspan class="key">Cloud Services</tspan>:<tspan class="cc"> ................ </tspan><tspan class="value">AWS, Firebase, Supabase</tspan>
<tspan x="430" y="270" class="cc">. </tspan><tspan class="key">Search and Caching</tspan>:<tspan class="cc"> ............... </tspan><tspan class="value">Elasticsearch, Redis</tspan>
<tspan x="430" y="290" class="cc">. </tspan><tspan class="key">APIs and Protocols</tspan>:<tspan class="cc"> ............ </tspan><tspan class="value">REST, gRPC, MCP, WebRTC</tspan>
<tspan x="430" y="310" class="cc">. </tspan><tspan class="key">Real-time Updates</tspan>:<tspan class="cc"> ..... </tspan><tspan class="value">SSE, Socket.io, MQTT, APNs, FCM</tspan>

<tspan x="430" y="350">- Experience —————————————————————————————————————————————</tspan>
<tspan x="430" y="370" class="cc">. </tspan><tspan class="key">Methodology</tspan>:<tspan class="cc"> ........................ </tspan><tspan class="value">Agile, Scrum, JIRA</tspan>
<tspan x="430" y="390" class="cc">. </tspan><tspan class="key">Domains</tspan>:<tspan class="cc"> ..... </tspan><tspan class="value">Ride-sharing, Fitness, Finance, Education</tspan>
<tspan x="430" y="410" class="cc">. </tspan><tspan class="key">Wearables</tspan>:<tspan class="cc"> ...... </tspan><tspan class="value">Apple Watch, HealthKit, Health Connect</tspan>
<tspan x="430" y="430" class="cc">. </tspan><tspan class="key">Payments</tspan>:<tspan class="cc"> ............... </tspan><tspan class="value">Stripe, StoreKit, Play Billing</tspan>
<tspan x="430" y="470">- Patterns ———————————————————————————————————————————————</tspan>
<tspan x="430" y="490" class="cc">. </tspan><tspan class="value">Bulkhead, Circuit Breaking, Load Shedding, Rate Limiting</tspan>
<tspan x="430" y="510" class="cc">. </tspan><tspan class="value">Eventual Consistency, Fail-Fast, Defense in Depth</tspan>
</text>
