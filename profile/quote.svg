<svg xmlns="http://www.w3.org/2000/svg" width="800" height="96" viewBox="0 0 800 96" role="img" aria-label="Quote" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F05138"/>
      <stop offset=".5" stop-color="#A97BFF"/>
      <stop offset="1" stop-color="#3178c6"/>
    </linearGradient>
  </defs>
  <style>
    .quote { font: 600 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; animation: fade .6s ease-out backwards; }
    .hl { fill: #61dafb; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  </style>

  <rect width="800" height="96" rx="12" fill="#20232a"/>

  <!-- ✏️ EDIT: your quote. Highlight = <tspan class="hl">…</tspan>
       Quote longer than ~70 characters? add: textLength="740" lengthAdjust="spacingAndGlyphs" to the <text> tag -->
  <text class="quote" x="400" y="52" text-anchor="middle"><tspan class="hl">Don’t be a fool:</tspan> get LLM to back automations, not endless repetitive code</text>

  <rect x="340" y="68" width="120" height="3" rx="1.5" fill="url(#line)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>